syntax = "proto3";

package triage.v1;

// TriageService serves the derived dependency board: a graph computed from
// GitHub issues, their sub-issue hierarchy, and native dependencies, induced by
// the set of currently-active epics. It is read-only — the board reflects
// GitHub; writes are delegated to existing tooling.
service TriageService {
  // GetBoard returns the current render set: one view per active epic.
  rpc GetBoard(GetBoardRequest) returns (GetBoardResponse) {}

  // StreamBoard pushes the render set whenever it changes (a GitHub event
  // recomputes it). The first message is the current snapshot. These are full
  // snapshots, not deltas — the set is small, so the stream is idempotent and
  // self-healing across reconnects.
  rpc StreamBoard(StreamBoardRequest) returns (stream StreamBoardResponse) {}
}

message GetBoardRequest {}
message StreamBoardRequest {}

message GetBoardResponse {
  Board board = 1;
}

message StreamBoardResponse {
  Board board = 1;
}

// Board is the full render set the frontend draws.
message Board {
  repeated EpicView epics = 1;
  // dependencies are the "blocked by" edges among the rendered issues — the
  // actual "what blocks what" wiring, so the client draws real blocking chains
  // (blocked task -> blocker) rather than inferring them.
  repeated DependencyEdge dependencies = 2;
}

// DependencyEdge is one native GitHub dependency between two rendered issues:
// blocked cannot start until blocker closes.
message DependencyEdge {
  int64 blocked = 1; // the issue held up
  int64 blocker = 2; // the issue holding it up
}

// EpicStatus mirrors the algorithm's per-epic outcome.
enum EpicStatus {
  EPIC_STATUS_UNSPECIFIED = 0;
  EPIC_STATUS_ACTIVE = 1; // has ready work to pick up
  EPIC_STATUS_STALLED = 2; // open work, but all of it is blocked — see blockers
  EPIC_STATUS_EMPTY = 3; // no open ladder work (done or unplanned)
}

// EpicView is one active epic's slice of the board.
message EpicView {
  IssueRef epic = 1;
  EpicStatus status = 2;
  repeated Node ready = 3; // ranked ready leaves, when ACTIVE
  repeated Node blockers = 4; // actionable open blockers, when STALLED
  // blocked are the epic's own ladder tasks that are held up (when STALLED),
  // each directly blocked by one of `blockers`. Together with Board.dependencies
  // they render the chain: epic -> blocked task -> blocker.
  repeated Node blocked = 5;
}

// Node is a rendered issue plus the context and flags the frontend needs.
message Node {
  IssueRef issue = 1;
  // leverage: how many open in-scope issues this node transitively unblocks.
  int32 leverage = 2;
  // ancestry: hierarchy path toward the epic, nearest-first, for "why this".
  repeated IssueRef ancestry = 3;
  // serves_epics: every active epic (by issue number) whose scope includes this
  // node, so the client can dedupe a shared vertex while showing all owners.
  repeated int64 serves_epics = 4;
  bool multi_epic = 5;
  bool high_leverage = 6;
}

// IssueRef is the displayable identity of an issue.
message IssueRef {
  int64 number = 1; // GitHub issue number
  string title = 2;
  string url = 3;
  bool open = 4;
}
